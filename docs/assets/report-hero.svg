<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
  <rect width="860" height="560" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f57"/><circle cx="44" cy="24" r="6" fill="#febc2e"/><circle cx="64" cy="24" r="6" fill="#28c840"/>
  <text x="430" y="29" fill="#8b949e" text-anchor="middle" font-size="12">acp-hermes report — live output from a governed Hermes agent</text>
  <g fill="#c9d1d9">
    <text x="28" y="64" fill="#7ee787">$ acp-hermes report</text>
    <text x="28" y="92" fill="#8b949e">ACP local report — last 7 days (this machine, ~/.acp/hermes-local.db)</text>
    <text x="28" y="126" fill="#79c0ff" font-weight="bold">MODEL SPEND</text>
    <text x="28" y="148" fill="#8b949e">  model                    calls   in-tok  out-tok  cache</text>
    <text x="28" y="170">  gemini-pro-latest          164     827K     5.2K    83%</text>
    <text x="28" y="192">  total                      164     827K     5.2K</text>
    <text x="28" y="226" fill="#79c0ff" font-weight="bold">CACHE</text>
    <text x="28" y="248">  hit rate <tspan fill="#7ee787" font-weight="bold">83%</tspan>  (4.1M of 5.0M prompt tokens read from cache)</text>
    <text x="28" y="282" fill="#79c0ff" font-weight="bold">CONTEXT COMPOSITION (share of prompt chars, all turns)</text>
    <text x="28" y="304">  tool results <tspan fill="#ffa657">96%</tspan> · system 0% · assistant 1% · user 3%</text>
    <text x="28" y="326" fill="#8b949e">  Tool results dominate your context — truncating or summarizing</text>
    <text x="28" y="344" fill="#8b949e">  large tool outputs is usually the cheapest big win.</text>
    <text x="28" y="378" fill="#79c0ff" font-weight="bold">TOOLS (top by calls)</text>
    <text x="28" y="400" fill="#8b949e">  tool             calls  errors  avg ms   output</text>
    <text x="28" y="422">  terminal           160       0    1201    492KB</text>
    <text x="28" y="444">  execute_code         1       0     110     271B</text>
    <text x="28" y="466">  skills_list          1       0       0     101B</text>
    <text x="28" y="500" fill="#8b949e">— metered locally by the acp plugin. zero account, nothing leaves</text>
    <text x="28" y="518" fill="#8b949e">  the machine. cloud mode adds allow/ask/deny policy + a console.</text>
  </g>
</svg>
