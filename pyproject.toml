[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acp-hermes"
version = "0.2.6"
description = "ACP governance plugin for Hermes Agent — audit and veto every tool call via the Agentic Control Plane."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Agentic Control Plane" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://agenticcontrolplane.com"
Documentation = "https://agenticcontrolplane.com/integrations/hermes"
Source = "https://github.com/agentic-control-plane/hermes-acp-plugin"
Issues = "https://github.com/agentic-control-plane/hermes-acp-plugin/issues"

[project.entry-points."hermes_agent.plugins"]
acp = "acp_hermes"

[project.scripts]
# acp-hermes is the primary, unambiguous name — and as of 0.2.5 the
# distribution is named for it too, so package, module, and command finally
# agree. hermes-acp stays as a compatibility alias for anyone who installed
# the old name, but Nous's hermes-agent ships its OWN bin of that name
# (Agent Client Protocol editor mode) — install order decides who owns it,
# which is exactly why it is no longer the primary.
acp-hermes = "acp_hermes.cli:main"
hermes-acp = "acp_hermes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acp_hermes"]
